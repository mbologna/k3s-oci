# cert-manager ClusterIssuers — GitOps adoption template
#
# The servers create the two HTTP-01 issuers when certmanager_email is set (nodes.tf).
# To manage them through Argo CD instead:
#   1. Replace "changeme@example.com" below with your real email address
#   2. Add the Application manifest to gitops/apps/:
#      cp gitops/cert-manager/application-template.yaml gitops/apps/cert-manager-issuers.yaml
#   3. Commit and push — ArgoCD will adopt the existing ClusterIssuers
#
# HTTP-01 solver: an Ingress of class traefik, pinned to Traefik's web entrypoint.
#
# DNS-01 (Cloudflare) variant, commented out at the end: wildcard certificates
# (*.example.com) and no inbound port 80.
---
# HTTP-01 issuers
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # TODO: set this to certmanager_email
    email: changeme@example.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # Traefik's default entrypoint is websecure and :80 redirects to
            # HTTPS; the challenge must be answered on :80, so the solver's
            # Ingress is pinned to the web entrypoint, where it outranks the
            # redirect (gitops/apps/traefik.yaml).
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: set this to certmanager_email
    email: changeme@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # Traefik's default entrypoint is websecure and :80 redirects to
            # HTTPS; the challenge must be answered on :80, so the solver's
            # Ingress is pinned to the web entrypoint, where it outranks the
            # redirect (gitops/apps/traefik.yaml).
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
---
# DNS-01 issuers
# Uncomment, replace the email and use them instead of the HTTP-01 ones above.
# Requires a cloudflare-api-token Secret (key api-token) in the cert-manager
# namespace, for example from an ExternalSecret.
