---
# Namespaces of the optional features (enable_external_dns, enable_external_secrets)
# and of Traefik. ArgoCD's CreateNamespace=true only creates the Application's
# destination namespace, so these must exist for the NetworkPolicies in
# external-dns.yaml / external-secrets.yaml / traefik.yaml to apply. Empty namespaces with default-deny policies are harmless until pods appear.
# The others (argocd, cert-manager, longhorn-system) are created by cloud-init or
# by their Application and listed here only for their Pod Security labels.
#
# Pod Security Admission: baseline wherever the pods allow it (no host
# namespaces, hostPath or privileged containers); Longhorn needs privileged
# (iSCSI, host mounts), and warn/audit still report what exceeds baseline.
# kube-system stays k3s's; system-upgrade gets privileged from the SUC manifest.
#
# Prune=false: removing this file must never delete a namespace that holds a workload.
# Delete=false: neither must deleting the network-policies Application.
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
