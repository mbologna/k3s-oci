---
# No API token in pods that don't ask for one. The default ServiceAccounts have
# no RBAC, and every module component that calls the API runs as its own
# ServiceAccount, so a token mounted into any other pod only helps an attacker
# who gets into it. A workload that needs the API should use its own
# ServiceAccount (or set automountServiceAccountToken: true on its pod).
# kube-system, kube-public and kube-node-lease stay k3s's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cert-manager
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: longhorn-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: traefik
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: system-upgrade
automountServiceAccountToken: false
