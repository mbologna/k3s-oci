# External Secrets Operator, opt-in: copy this file to gitops/apps/ (in your fork)
# to install it, then add an oci-vault ClusterSecretStore (gitops/external-secrets/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
    targetRevision: "2.15.0"
    helm:
      valuesObject:
        installCRDs: true
        # Measured: controller ~40 MiB.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        # No webhook and so no cert-controller (~35 + ~67 MiB): no ESO CRD
        # uses a conversion webhook, so the webhook only validated specs on
        # admission, and the cert-controller only issued its certificate. ESO
        # reports a bad spec in the resource's status instead.
        webhook:
          create: false
        certController:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
