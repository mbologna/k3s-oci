---
# Longhorn backups to OCI Object Storage (S3-compatible) — template, all commented out.
#
# Longhorn >= 1.8 configures the backup destination via the BackupTarget CR named
# "default" (created by longhorn-manager). The old `backup-target` /
# `backup-target-credential-secret` Settings no longer exist — do not use them.
#
# Automated path: set enable_longhorn_backup = true + create_longhorn_backup_user = true
# + region in tfvars; cloud-init creates the secret, patches the BackupTarget and applies
# the daily-backup RecurringJob. Manual path: scripts/setup-longhorn-backup.sh, or the
# steps below.
#
# 1. Create an OCI Customer Secret Key (S3 credentials, max 2 per user) for a service
#    user limited to this bucket — the key carries all of its user's rights, so never
#    use an admin user:
#    Console → Identity → Users → <service-user> → Customer Secret Keys → Generate Secret Key.
# 2. Create the credential secret. AWS_ENDPOINTS is REQUIRED for OCI:
#    kubectl create secret generic longhorn-backup-secret \
#      --from-literal=AWS_ACCESS_KEY_ID='<customer-secret-key-id>' \
#      --from-literal=AWS_SECRET_ACCESS_KEY='<customer-secret-key>' \
#      --from-literal=AWS_ENDPOINTS='https://<namespace>.compat.objectstorage.<region>.oraclecloud.com' \
#      -n longhorn-system
# 3. Point the BackupTarget at the bucket (format s3://<bucket>@<region>/):
#    kubectl -n longhorn-system patch backuptargets.longhorn.io default --type merge \
#      -p '{"spec":{"backupTargetURL":"s3://<cluster>-longhorn-backup@<region>/","credentialSecret":"longhorn-backup-secret"}}'
#    Check: kubectl -n longhorn-system get backuptargets   (AVAILABLE should be true)
# 4. Optionally uncomment the RecurringJob below and copy it into a path ArgoCD
#    syncs (or kubectl apply it) to back up every volume in the "default" group weekly.
#
# Budget: the backup bucket shares the Object Storage free tier with the state
# bucket (20 GB on Free Tier accounts, 10 GB on Pay As You Go). Longhorn backups
# are incremental, but keep `retain` low and watch the bucket size.
#
# See: https://longhorn.io/docs/latest/snapshots-and-backups/backup-and-restore/set-backup-target/

# apiVersion: longhorn.io/v1beta2
# kind: RecurringJob
# metadata:
#   name: weekly-backup
#   namespace: longhorn-system
# spec:
#   task: backup
#   cron: "0 3 * * 0"
#   groups:
#     - default
#   retain: 4
#   concurrency: 1
