# TEMPLATE — DO NOT APPLY DIRECTLY
# Reference for a Longhorn UI ingress with basic auth: fill in the hostname,
# generate the hash and copy the file into your gitops tree. (Behind a tailnet,
# a Tailscale LoadBalancer Service needs no password.)
---
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-basic-auth-secret
  namespace: longhorn-system
type: Opaque
stringData:
  # htpasswd lines under the key Traefik reads, `users`. {SHA}, apr1 and bcrypt
  # hashes all work; e.g. htpasswd -nbB admin 'your-password'
  users: "admin:$apr1$replaceme$replaceme"
---
# BasicAuth for the Longhorn UI, attached to the Ingress below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-basic-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: longhorn-basic-auth-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-frontend-tls
  # Same namespace as the Ingress: an Ingress can only use a Secret of its own.
  namespace: longhorn-system
spec:
  secretName: longhorn-frontend-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    # TODO: replace with your actual hostname
    - longhorn.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-basic-auth@kubernetescrd
    # Optional, for a DNS controller such as external-dns: the public NLB IP.
    # external-dns.alpha.kubernetes.io/target: "<public-nlb-ip>"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        # TODO: replace with your actual hostname
        - longhorn.example.com
      secretName: longhorn-frontend-tls
  rules:
    # TODO: replace with your actual hostname
    - host: longhorn.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
