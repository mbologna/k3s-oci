---
# Alerts a webhook when a node stays unschedulable. system-upgrade-controller
# can leave a node cordoned when a k3s upgrade fails mid-job, and nothing else
# notices: running pods keep running, new ones stay Pending. kured and the
# upgrade Plans cordon nodes routinely, so a cordon only alerts if it is still
# there RECHECK_SECONDS (25 min) later.
#
# Needs the Secret node-cordon-alert-webhook (key: url) in this namespace, see
# application-template.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-cordon-alert
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-cordon-alert
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-cordon-alert
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-cordon-alert
subjects:
  - kind: ServiceAccount
    name: node-cordon-alert
    namespace: node-cordon-alert
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-cordon-alert
  labels:
    app.kubernetes.io/name: node-cordon-alert
spec:
  schedule: "*/30 * * * *"
  timeZone: UTC
  # Forbid: a run waiting out the recheck window skips the next slot instead of
  # alerting twice.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1740
      template:
        metadata:
          labels:
            app.kubernetes.io/name: node-cordon-alert
        spec:
          restartPolicy: Never
          serviceAccountName: node-cordon-alert
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # renovate: datasource=docker depName=curlimages/curl
              image: curlimages/curl:8.23.0
              env:
                # Shown in the alert; set it to your cluster_name.
                - name: CLUSTER
                  value: my-k3s
                - name: RECHECK_SECONDS
                  value: "1500"
                - name: WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: node-cordon-alert-webhook
                      key: url
              command:
                - sh
                - -c
                - |
                  set -eu
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  # Names of unschedulable nodes. Metadata-only response, so every
                  # "name" field is a node name (no kubectl/jq in this image).
                  # Fully qualified: a dotted name like kubernetes.default.svc is
                  # looked up as-is first, and musl resolvers (this image) never
                  # fall back to the search list when ndots is lowered.
                  cordoned() {
                    resp=$(curl -sSf -m 30 -H "Authorization: Bearer $(cat "$SA/token")" --cacert "$SA/ca.crt" \
                      -H 'Accept: application/json;as=PartialObjectMetadataList;v=v1;g=meta.k8s.io' \
                      'https://kubernetes.default.svc.cluster.local/api/v1/nodes?fieldSelector=spec.unschedulable%3Dtrue') || return 1
                    printf '%s' "$resp" | grep -o '"name": *"[^"]*"' | cut -d'"' -f4 | sort | tr '\n' ' '
                  }
                  # The explicit || matters: busybox sh ignores set -e inside $(...),
                  # so a failed API call would otherwise read as "no cordoned nodes".
                  first=$(cordoned) || { echo "cannot list nodes" >&2; exit 1; }
                  [ -n "$first" ] || { echo "no cordoned nodes"; exit 0; }
                  echo "cordoned: $first — rechecking in ${RECHECK_SECONDS}s"
                  sleep "$RECHECK_SECONDS"
                  still=$(cordoned) || { echo "cannot list nodes" >&2; exit 1; }
                  [ -n "$still" ] || { echo "uncordoned meanwhile"; exit 0; }
                  echo "still cordoned: $still"
                  title="${CLUSTER}: node cordoned"
                  body="Unschedulable for 25+ min: ${still}- check system-upgrade-controller and kured, then: kubectl uncordon <node>"
                  # The same message under the keys common receivers read: title/body
                  # (Apprise API), text (Slack, Mattermost), content (Discord),
                  # message (Gotify). Receivers ignore the keys they don't know.
                  payload=$(printf '{"title":"%s","body":"%s","type":"warning","text":"%s: %s","content":"%s: %s","message":"%s"}' \
                    "$title" "$body" "$title" "$body" "$title" "$body" "$body")
                  curl -sSf -m 30 -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK_URL"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
