apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubereboot.github.io/charts
    chart: kured
    # renovate: datasource=helm depName=kured registryUrl=https://kubereboot.github.io/charts
    targetRevision: "6.1.0"
    helm:
      valuesObject:
        configuration:
          rebootSentinelFile: /var/run/reboot-required
          # Maintenance window: 02:15-04:15 UTC (03:15-05:15 CET, 04:15-06:15 CEST).
          #
          # UTC, like every other schedule this module creates: the package timers
          # (files/lib/bootstrap-*.sh), the Longhorn recurring jobs and the etcd
          # snapshot (files/lib/k3s-*.sh) are all UTC, and Longhorn and k3s offer no
          # timezone setting at all. A window in local time moves an hour against
          # them at every DST change, so the order "patch, then reboot" holds in
          # one season and not the other.
          #
          # Opens after the latest package run can finish: apt-daily-upgrade fires
          # at 01:00 UTC with up to 30 min jitter, plus needrestart, so ~01:45.
          # Edit here to change the window; must match NLB maintenance expectations.
          startTime: "02:15"
          endTime: "04:15"
          timeZone: UTC
          # system-upgrade-controller (gitops/system-upgrade/plans.yaml) also cordons
          # and drains nodes, on no schedule at all: as soon as a new k3s release
          # reaches the channel. kured's lock does not cover it, so without this
          # kured could reboot a node in the middle of a k3s upgrade.
          #
          # upgrade.cattle.io/plan, NOT upgrade.cattle.io/controller: the SUC
          # controller Deployment itself carries the controller label and runs
          # permanently, so selecting on it would silently block every reboot.
          # Only the per-node upgrade Job pods carry the plan label.
          blockingPodSelector:
            - upgrade.cattle.io/plan
          rebootDays:
            - tue
            - wed
            - thu
          # Check every 10 min, not the chart's 1 h: with two nodes taking turns in
          # a 2 h window, an hourly check can push the second node to the next
          # reboot day.
          period: 10m
          # A node that dies mid-drain or mid-reboot otherwise holds the lock
          # forever and blocks every later reboot (no TTL by default).
          lockTtl: 2h
          # Give up on a drain stuck on a PodDisruptionBudget instead of hanging
          # the whole window; the node is uncordoned and retried at the next check.
          drainTimeout: 15m
        # A preempted kured can't release its lock or finish a drain. Built in,
        # so it needs no PriorityClass of its own.
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        # The chart's default probe timeouts flap on a 1-OCPU node at full CPU
        # requests: scheduling latency alone can exceed them, and the restarts
        # snowballed into days of CrashLoopBackOff on a cluster built from this
        # module.
        livenessProbe:
          timeoutSeconds: 15
          failureThreshold: 8
        readinessProbe:
          timeoutSeconds: 15
          failureThreshold: 8
        # Every taint: kured has to run on every node it may need to reboot,
        # including a worker tainted NoSchedule (gitops/longhorn/taint-toleration.yaml).
        tolerations:
          - operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
