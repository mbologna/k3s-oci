apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
      targetRevision: "v1.21.3"
      helm:
        valuesObject:
          crds:
            enabled: true
          config:
            apiVersion: controller.config.cert-manager.io/v1alpha1
            kind: ControllerConfiguration
            enableGatewayAPI: true
          # Above worker-pinned (gitops/priority-classes/): a batch job required on
          # the worker must not preempt cert-manager, or certificates stop renewing.
          global:
            priorityClassName: platform-critical
          # All three parts are light and talk to the API server: they prefer the
          # control-plane node, run on the worker while it is drained, and the
          # descheduler (gitops/apps/descheduler.yaml) moves them back.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
          # Controller — issues certificates, manages ACME challenges
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          # Webhook — validates and mutates cert-manager CRs; must be available for API calls
          webhook:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          # cainjector — injects CA bundles into webhook configurations
          cainjector:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          # startupapicheck — one-shot init job that verifies the API is ready
          startupapicheck:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
          # Prometheus ServiceMonitor disabled — kube-prometheus-stack (which provides the
          # ServiceMonitor CRD) is not deployed. Leaving it enabled makes ArgoCD fail to sync
          # cert-manager ("no matches for kind ServiceMonitor").
          prometheus:
            servicemonitor:
              enabled: false
  # cainjector writes the caBundle; the chart renders it empty.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # required for CRD resources with large annotations
      # Without it ignoreDifferences only hides the diff: every sync still writes
      # the chart's empty caBundle back over the one cainjector set, and the
      # webhook rejects calls until cainjector refills it.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
