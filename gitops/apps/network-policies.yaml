apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mbologna/k3s-oci.git
    targetRevision: HEAD
    path: gitops/network-policies
  destination:
    server: https://kubernetes.default.svc
    # Manifests specify their own namespaces; this is a fallback for un-namespaced resources.
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The optional feature namespaces (external-dns, external-secrets) are created by
      # gitops/network-policies/namespaces.yaml — CreateNamespace only covers "default".
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
