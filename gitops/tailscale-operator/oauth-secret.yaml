---
# ExternalSecret — syncs Tailscale OAuth client credentials from OCI Vault
# into the 'operator-oauth' Secret used by the Tailscale operator.
#
# Requires the External Secrets Operator and an oci-vault ClusterSecretStore
# (gitops/external-secrets/), with the two secrets stored in your vault as:
#   <cluster_name>-tailscale-oauth-client-id
#   <cluster_name>-tailscale-client-secret
#
# TODO: replace "my-k3s" below with your cluster_name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: my-k3s-tailscale-oauth-client-id
    - secretKey: client_secret
      remoteRef:
        key: my-k3s-tailscale-client-secret
