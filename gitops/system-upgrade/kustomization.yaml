apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Remote SUC manifests — the version appears in both URLs below. A custom regex
# manager in renovate.json updates both URLs in the same PR.
resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.2/crd.yaml
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.2/system-upgrade-controller.yaml
  - plans.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
        namespace: system-upgrade
      spec:
        template:
          spec:
            containers:
              - name: system-upgrade-controller
                env:
                  - name: SYSTEM_UPGRADE_JOB_ACTIVE_DEADLINE_SECONDS
                    value: "1800"
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "500m"
                    memory: "256Mi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
        namespace: system-upgrade
        labels:
          app.kubernetes.io/name: system-upgrade-controller
      spec:
        template:
          metadata:
            labels:
              app.kubernetes.io/name: system-upgrade-controller
