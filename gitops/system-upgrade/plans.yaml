---
# k3s upgrade Plans managed by system-upgrade-controller.
# Edit 'channel' below to switch between "stable", "latest", or "testing".
# "stable" is the default; override in your fork if you need a different channel.
#
# ⚠️  CHANNEL DRIFT NOTE: channel: stable tracks the k3s stable release stream
# independently of var.k3s_version in terraform.tfvars. After a fresh deploy, SUC
# will upgrade the cluster beyond the Terraform-pinned version on the next upgrade
# cycle. This is intentional — the pin in vars.tf only controls the initial install;
# ongoing upgrades are delegated to SUC. If you need to lock the cluster at the
# initial version, set 'version' below (and remove 'channel'):
#   version: v1.31.4+k3s1   # renovate: datasource=github-releases depName=k3s-io/k3s
#   channel: ""
#
# Pin a specific version by setting the 'version' field below (and setting
# channel to "" or removing it). Renovate will open PRs to bump the version
# automatically using the regex manager configured in renovate.json.
# Example:
#   version: v1.31.4+k3s1   # renovate: datasource=github-releases depName=k3s-io/k3s
#   channel: ""
#
# Upgrade window: 23:00-23:59 UTC, every night. Without a window SUC cordons a
# node and restarts its k3s whenever a release reaches the channel, at any hour. The window
# sits before every other nightly job: the etcd snapshot (00:00, files/lib/
# common.sh), the Longhorn backup (00:30, files/lib/k3s-secrets.sh), the package
# runs (00:30 and 01:00 plus jitter, files/lib/bootstrap-*.sh) and kured's
# reboot window (02:15-04:15, gitops/apps/kured.yaml). SUC only starts Jobs
# inside the window; one that overruns is safe, since kured stands down while an
# upgrade Job exists (its blockingPodSelector). UTC like the rest of the chain.
# Narrow 'days' to match kured's rebootDays if you would rather not restart k3s
# on other nights; k3s patch releases often carry security fixes.
#
# cordon, no drain: restarting k3s leaves running containers up (k3s keeps the
# containerd shims, and the installer's unit uses KillMode=process), so an
# upgrade needs nothing moved. Draining made it worse: on a cluster built from
# this module the server drain moved every pod to the worker, and the worker
# drain two minutes later sent ~40 pods onto the control plane just as its
# freshly upgraded k3s was rebuilding its caches; the node ran out of memory and
# k3s crash-looped for 20 minutes. Reboots still drain, through kured.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  concurrency: 1
  channel: https://update.k3s.io/v1-release/channels/stable
  # version: v1.31.4+k3s1  # renovate: datasource=github-releases depName=k3s-io/k3s
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
  window:
    days: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    startTime: "23:00"
    endTime: "23:59"
    timeZone: UTC
  serviceAccountName: system-upgrade
  cordon: true
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  concurrency: 1
  channel: https://update.k3s.io/v1-release/channels/stable
  # version: v1.31.4+k3s1  # renovate: datasource=github-releases depName=k3s-io/k3s
  nodeSelector:
    matchExpressions:
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
  # Same window as k3s-server above.
  window:
    days: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    startTime: "23:00"
    endTime: "23:59"
    timeZone: UTC
  serviceAccountName: system-upgrade
  cordon: true
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  upgrade:
    image: rancher/k3s-upgrade
