# External Secrets — a usage example
#
# Syncs an OCI Vault secret into a Kubernetes Secret through the 'oci-vault'
# ClusterSecretStore (cluster-secret-store-template.yaml). Copy and adapt into
# your own Argo CD Application or namespace.
---
# Create the vault secret first, e.g.:
#   oci vault secret create-base64 --secret-name my-app-db-password ...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-db-password
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: my-app-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: "my-app-db-password"
