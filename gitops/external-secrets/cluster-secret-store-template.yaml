# External Secrets Operator -- ClusterSecretStore template for OCI Vault.
#
# The nodes' instance principal gets no vault access (pods are kept away from the
# metadata service): the store signs in as an API-key user. Create a user whose
# group may only `read secret-family in compartment <c> where target.vault.id =
# '<vault-ocid>'`, give it an API key, and store the key in a Secret:
#   kubectl -n external-secrets create secret generic oci-api-key \
#     --from-file=privateKey=<key.pem> --from-literal=fingerprint=<fingerprint>
# Then fill in the OCIDs and region below and let Argo CD sync this file (copy
# it into a directory an Application syncs).
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
spec:
  provider:
    oracle:
      # TODO: your vault, region, tenancy and the API-key user.
      vault: "ocid1.vault.oc1.REGION.XXXXX"
      region: "REGION"
      principalType: UserPrincipal
      auth:
        tenancy: "ocid1.tenancy.oc1..XXXXX"
        user: "ocid1.user.oc1..XXXXX"
        secretRef:
          privatekey:
            name: oci-api-key
            namespace: external-secrets
            key: privateKey
          fingerprint:
            name: oci-api-key
            namespace: external-secrets
            key: fingerprint
