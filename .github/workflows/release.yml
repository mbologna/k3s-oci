name: Release

# Monday 06:00 UTC, like every other repository: tags the next version when a
# feat, fix, perf, revert or breaking commit landed on main since the last tag,
# and publishes the GitHub release with notes grouped by commit type
# (https://github.com/mbologna/auto-release). A push releases at once only a
# fix(security) update. Run it by hand on main to release at once, or with
# dry_run to preview. Nothing builds on tags here, so no tag build is dispatched.

"on":
  # A push releases only a CVE fix (security strategy); the rest waits for Monday.
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show the next version and its notes in the job summary
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  auto-release:
    # Monday's schedule and a manual run release with the strategy below; a push
    # to the default branch releases only a CVE fix (the wrapper switches to the
    # security strategy). The tag build auto-release dispatches runs on the tag
    # ref, so it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@b85a51a50cc1e566534b425c3275095a1b7fb58a # main
    with:
      strategy: conventional
      dispatch_tag_build: false
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
