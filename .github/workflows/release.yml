name: Release

# Monday 06:00 UTC, like every other repository: tags the next version when
# anything landed on main since the last tag, and publishes the GitHub release
# with notes grouped by commit type (https://github.com/mbologna/auto-release).
# Run it by hand on main to release at once, or with dry_run to preview.
# Nothing builds on tags here, so no tag build is dispatched.

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show the next version and its notes in the job summary
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  auto-release:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      strategy: commits
      dispatch_tag_build: false
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
