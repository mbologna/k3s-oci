name: CI

"on":
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "files/**"
      - "gitops/**"
      - "scripts/**"
      - "example/**"
      - ".github/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".tflint.hcl"
      - ".terraform-docs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "Justfile"
      - "renovate.json"
  # No paths filter on pull_request: the ruleset requires these checks, and a
  # filtered-out PR would never report them and stay blocked.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  security-events: write

jobs:
  terraform:
    uses: mbologna/.github/.github/workflows/terraform-ci.yml@56ec0eba66a17d43e9f4f573e9f64493b0a58895 # main
    with:
      terraform_version: "~> 1.9"
      opentofu_version: "1.9.1"
      enable_shellcheck: true
      shellcheck_files: >-
        files/lib/bootstrap-ubuntu.sh
        files/lib/bootstrap-opensuse.sh
        files/lib/common.sh
        files/lib/k3s-server.sh
        files/lib/k3s-bootstrap.sh
        files/lib/k3s-secrets.sh
        files/lib/k3s-cert-manager.sh
        files/lib/k3s-external-secrets.sh
        files/lib/k3s-argocd.sh
        files/lib/k3s-agent.sh
        scripts/clean-oci-resources.sh
        scripts/teardown-keep-data.sh
        scripts/import-opensuse-aarch64.sh
        scripts/setup-longhorn-backup.sh
        gitops/update-repo-url.sh
        example/get-kubeconfig.sh
        example/ssh-node.sh
      example_dir: example
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@56ec0eba66a17d43e9f4f573e9f64493b0a58895 # main
    with:
      max_age_days: 7
    permissions:
      actions: write
