name: release-please

"on":
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens/updates the release PR from conventional commits; merging it tags vX.Y.Z
  # and publishes the GitHub release. The PR is created with GITHUB_TOKEN, so CI
  # does not run on it — merge it with the admin ruleset bypass (see AGENTS.md).
  release-please:
    uses: mbologna/.github/.github/workflows/release-please.yml@83a94cc1bdc464afe31abb9cb99a575e5a8a38ef # main
    permissions:
      contents: write
      pull-requests: write
